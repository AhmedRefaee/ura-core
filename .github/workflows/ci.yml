name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]

# A newer push to the same branch makes an in-flight run obsolete.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze-and-test:
    name: Analyze & test
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v5

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.0
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      # Note: a `dart format --set-exit-if-changed` gate is deliberately not
      # here yet. 150 of 221 files currently differ from dart format, so the
      # gate would need a repo-wide reformat commit before it could pass.
      - name: Analyze
        run: flutter analyze --fatal-infos

      - name: Test
        run: flutter test --reporter=github
  deploy-web:
    name: Deploy web app
    # Only the real main branch ships. PR runs and feature branches stop at
    # analyze-and-test, so a green PR never touches the live site.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: analyze-and-test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # One deploy at a time. Two merges seconds apart once deployed out of
    # order: the older commit's run finished last and put the site back.
    concurrency:
      group: deploy-web
      cancel-in-progress: false

    steps:
      - uses: actions/checkout@v5

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.0
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build web
        run: flutter build web --release

      # Serves build/web to ura-core-9981c.web.app, per the hosting block in
      # firebase.json. Until v1.1.0 this was a manual step and the site sat two
      # months behind the APK.
      # Checked right before deploying, after the slow build: if main has
      # moved on, a newer run will deploy it -- this one must not overwrite it.
      - name: Skip if main has moved on
        id: tip
        run: |
          tip=$(git ls-remote "https://github.com/${{ github.repository }}" refs/heads/main | cut -f1)
          if [ "$tip" != "${{ github.sha }}" ]; then
            echo "main is at $tip, this run is ${{ github.sha }} -- not deploying a stale build."
            echo "stale=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy to Firebase Hosting
        if: steps.tip.outputs.stale != 'true'
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          projectId: ura-core-9981c
          channelId: live
